[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrtrack"
dynamic = ["version"]
description = "Phone head-tracking companion for OpenTrack (sim racing)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.6", "Pillow>=10"]

[project.scripts]
vrtrack = "vrtrack.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "vrtrack.__version__" }

[tool.setuptools.packages.find]
include = ["vrtrack*"]

[tool.setuptools.package-data]
vrtrack = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP037", "UP006", "UP007", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "F841"]
