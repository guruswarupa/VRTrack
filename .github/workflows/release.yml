name: Release

# Push a tag like v1.2.3 to publish: Windows installer (with OpenTrack), Linux bundle and Android APK.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.3 (builds artifacts only; no GitHub Release is created)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  tests:
    name: Run the test suites first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "pc[dev]"
      - run: ruff check pc
      - run: python -m pytest
        working-directory: pc
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Windows installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "pc[dev]"
      - name: Stamp version
        run: python tools/set_version.py "$env:VERSION"
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer (downloads and verifies OpenTrack, freezes the app, compiles with Inno Setup)
        shell: pwsh
        run: ./installer/build.ps1
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem installer/build/out/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Append -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer/build/out/*.exe
            installer/build/out/*.sha256
          if-no-files-found: error

  linux:
    name: Linux bundle
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -e "pc[dev]"
      - name: Stamp version
        run: python tools/set_version.py "$VERSION"
      - name: Freeze and pack
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name VRTrack \
            --icon assets/branding/icon-1024.png --paths pc \
            --add-data "pc/vrtrack/assets:vrtrack/assets" \
            --distpath dist --workpath build --specpath build pc/packaging/run_vrtrack.py
          tar -C dist -czf "VRTrack-${VERSION#v}-linux-x86_64.tar.gz" VRTrack
          sha256sum "VRTrack-${VERSION#v}-linux-x86_64.tar.gz" > "VRTrack-${VERSION#v}-linux-x86_64.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: VRTrack-*.tar.gz*
          if-no-files-found: error

  android:
    name: Android APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_model.py
      - name: Version numbers
        id: ver
        run: |
          v="${VERSION#v}"
          IFS=. read -r MA MI PA <<< "${v%%[-+]*}"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 1000000 + MI * 1000 + PA))" >> "$GITHUB_OUTPUT"
      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Decode signing key (if configured)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: publishing a debug-signed APK. See docs/development.md."
          fi
      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "../VRTrack-${{ steps.ver.outputs.name }}-android.apk"
      - name: Build debug-signed APK (no signing key configured)
        if: steps.sign.outputs.signed != 'true'
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}
          cp app/build/outputs/apk/debug/app-debug.apk "../VRTrack-${{ steps.ver.outputs.name }}-android-debug-signed.apk"
      - name: Checksums
        run: sha256sum VRTrack-*.apk > "VRTrack-${{ steps.ver.outputs.name }}-android.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            VRTrack-*.apk
            VRTrack-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*
          body: |
            ## Install
            - **Windows**: run `VRTrack-Setup-*.exe`. It installs VRTrack **and OpenTrack**, opens the firewall for your phone and pre-configures everything.
            - **Android**: install the `.apk` on your phone (allow installs from this source when asked).
            - **Linux**: extract the `.tar.gz` and run `VRTrack/VRTrack` (OpenTrack must be installed separately).

            See the [setup guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/setup.md).
            Verify downloads with the `.sha256` files.
