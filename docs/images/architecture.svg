<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#121a26"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- Phone -->
  <g>
    <rect x="30" y="70" width="250" height="180" rx="16" fill="#171b23" stroke="#2a303c" stroke-width="2"/>
    <rect x="30" y="70" width="250" height="6" rx="3" fill="#4da3ff"/>
    <text x="155" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#e8ebf2">Android phone</text>
    <text x="155" y="150" text-anchor="middle" font-size="16" fill="#8b93a7">Front camera</text>
    <text x="155" y="176" text-anchor="middle" font-size="16" fill="#8b93a7">MediaPipe face landmarks</text>
    <text x="155" y="202" text-anchor="middle" font-size="16" fill="#8b93a7">Head pose + gaze, on-device</text>
    <text x="155" y="232" text-anchor="middle" font-size="13" fill="#43d19e">no video leaves the phone</text>
  </g>

  <!-- phone -> VRTrack -->
  <line x1="286" y1="160" x2="352" y2="160" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="319" y="136" text-anchor="middle" font-size="13" fill="#e8ebf2">UDP</text>
  <text x="319" y="188" text-anchor="middle" font-size="12" fill="#8b93a7">Wi-Fi or</text>
  <text x="319" y="204" text-anchor="middle" font-size="12" fill="#8b93a7">USB tether</text>

  <!-- VRTrack -->
  <g>
    <rect x="360" y="70" width="250" height="180" rx="16" fill="#171b23" stroke="#2a303c" stroke-width="2"/>
    <rect x="360" y="70" width="250" height="6" rx="3" fill="#4da3ff"/>
    <text x="485" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#e8ebf2">VRTrack (PC)</text>
    <text x="485" y="150" text-anchor="middle" font-size="16" fill="#8b93a7">Sensitivity, dead zone, curve</text>
    <text x="485" y="176" text-anchor="middle" font-size="16" fill="#8b93a7">Smoothing + interpolation</text>
    <text x="485" y="202" text-anchor="middle" font-size="16" fill="#8b93a7">Per-game profiles</text>
    <text x="485" y="232" text-anchor="middle" font-size="13" fill="#43d19e">120 updates / second</text>
  </g>

  <!-- VRTrack -> OpenTrack -->
  <line x1="616" y1="160" x2="682" y2="160" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="649" y="136" text-anchor="middle" font-size="13" fill="#e8ebf2">UDP</text>
  <text x="649" y="188" text-anchor="middle" font-size="12" fill="#8b93a7">port 4242</text>

  <!-- OpenTrack -->
  <g>
    <rect x="690" y="70" width="250" height="180" rx="16" fill="#171b23" stroke="#2a303c" stroke-width="2"/>
    <rect x="690" y="70" width="250" height="6" rx="3" fill="#ffc857"/>
    <text x="815" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#e8ebf2">OpenTrack</text>
    <text x="815" y="150" text-anchor="middle" font-size="16" fill="#8b93a7">Input: UDP over network</text>
    <text x="815" y="176" text-anchor="middle" font-size="16" fill="#8b93a7">Output: FreeTrack 2.0</text>
    <text x="815" y="202" text-anchor="middle" font-size="16" fill="#8b93a7">Installed by the installer</text>
  </g>

  <!-- OpenTrack -> Game -->
  <line x1="946" y1="160" x2="1000" y2="160" stroke="#4da3ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="973" y="136" text-anchor="middle" font-size="13" fill="#e8ebf2">FreeTrack</text>

  <!-- Game -->
  <g>
    <rect x="1008" y="70" width="162" height="180" rx="16" fill="#171b23" stroke="#2a303c" stroke-width="2"/>
    <rect x="1008" y="70" width="162" height="6" rx="3" fill="#ff6b6b"/>
    <text x="1089" y="108" text-anchor="middle" font-size="22" font-weight="600" fill="#e8ebf2">Your game</text>
    <text x="1089" y="150" text-anchor="middle" font-size="16" fill="#8b93a7">ETS2 / ATS</text>
    <text x="1089" y="176" text-anchor="middle" font-size="16" fill="#8b93a7">Other FreeTrack</text>
    <text x="1089" y="202" text-anchor="middle" font-size="16" fill="#8b93a7">/ TrackIR games</text>
  </g>

  <text x="600" y="36" text-anchor="middle" font-size="15" fill="#8b93a7" letter-spacing="2">HOW VRTRACK WORKS</text>
  <text x="600" y="296" text-anchor="middle" font-size="13" fill="#8b93a7">Everything stays on your local network. No accounts, no cloud, no internet needed.</text>
</svg>
